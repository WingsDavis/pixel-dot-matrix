name: Android CI

on:
  pull_request:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**", "refactor/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1"
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - name: Test and build debug APKs
        run: ./gradlew --no-parallel testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug :wear:assembleDebug :watchface:assembleDebug
      - name: Validate WFF schema and memory limits
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/memory-footprint.jar" https://github.com/google/watchface/releases/download/release/memory-footprint.jar
          echo "98892722dcb0cf3c872776fa5ec1ba5aea1289621f04d15324e854b1cdaa3460  $RUNNER_TEMP/memory-footprint.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/memory-footprint.jar" --watch-face watchface/build/outputs/apk/debug/watchface-debug.apk --schema-version 2
      - uses: actions/upload-artifact@v7
        with:
          name: pixel-dot-matrix-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
            watchface/build/outputs/apk/debug/*.apk
          if-no-files-found: error
