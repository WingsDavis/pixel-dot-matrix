name: Android CI

on:
  pull_request:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**", "refactor/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test and build debug APKs
        run: ./gradlew --no-parallel testDebugUnitTest :app:assembleDebug :wear:assembleDebug :watchface:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-dot-matrix-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
            watchface/build/outputs/apk/debug/*.apk
          if-no-files-found: error
